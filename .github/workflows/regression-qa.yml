name: THE STUDIO regression QA

concurrency:
  group: regression-qa-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'algorithms/**', 'refinement/**', 'systems/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast autonomous controller and NPC autonomy checks
        run: node --check household-consumer-economics-engine.js && node --check household-consumer-economics-qa.js && node household-consumer-economics-qa.js && node --check autonomous-simulation-engine.js && node --check autonomous-simulation-qa.js && node autonomous-simulation-qa.js && node --check npc-autonomy-engine.js && node --check npc-autonomy-qa.js && node npc-autonomy-qa.js && node --check npc-decision-consequence-engine.js && node --check npc-decision-consequence-qa.js && node npc-decision-consequence-qa.js && node --check npc-social-network-engine.js && node --check npc-social-network-qa.js && node npc-social-network-qa.js && node --check npc-memory-reputation-engine.js && node --check npc-memory-reputation-qa.js && node npc-memory-reputation-qa.js && node --check media-ecosystem-engine.js && node --check media-ecosystem-qa.js && node media-ecosystem-qa.js && node --check npc-digital-society-engine.js && node --check npc-digital-society-qa.js && node npc-digital-society-qa.js
      - name: Validate player experience, onboarding and world risk
        run: node --check player-experience-layer.js && node --check phase1-world-engine.js && node --check simulation-depth-engine.js && node --check simulation-depth-qa.js && node simulation-depth-qa.js && node --check world-risk-qa.js && node world-risk-qa.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Phase 3 engine and finance tests
        run: |
          node --check phase3-founder-engine.js
          node test-phase3.js
          node test-phase3-interactions.js
          node test-phase3-hardening.js
      - name: Start app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/studio-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
      - name: Run player experience browser smoke test
        run: node player-experience-browser-qa.js
      - name: Verify all seven world systems execute on real simulation days
        run: node simulation-depth-runtime-qa.js
      - name: Validate global geography and travel engines
        run: |
          node --check phase1-global-geography-engine.js
          node --check phase1-global-mobility-engine.js
          node --check phase1-global-geography-travel-qa.js
      - name: Validate Phase 7 digital-life syntax early
        run: node --check phase7-digital-life-engine.js && node --check phase7-digital-life-qa.js
      - name: Run actual application form regression
        run: node actual-phase3-submit-qa.js
      - name: Run simulation and save round-trip regression
        id: phase3_save_roundtrip
        continue-on-error: true
        run: node phase3-end-to-end.js
      - name: Run Phase 4 company management browser QA
        run: node phase4-browser-qa.js
      - name: Validate Phase 5 production engine
        run: node --check phase5-production-engine.js
      - name: Run Phase 5 production browser QA
        run: node phase5-browser-qa.js
      - name: Validate Phase 6 ecosystem engine and finance tests
        run: |
          node --check phase6-ecosystem-engine.js
          node --check phase6-audience-engine.js
          node --check phase-integration-engine.js
          node --check integration-multiyear-qa.js && node --check simulation-depth-engine.js && node --check simulation-depth-qa.js
          node --check phase6-browser-qa.js
          node test-phase6.js
          node test-phase6-audience.js
      - name: Run Phase 6 mobile browser regression
        run: node phase6-browser-qa.js
      - name: Validate Phase 7 smartphone engine
        run: node --check phase7-smartphone-engine.js && node --check phase7-digital-life-engine.js && node --check phase7-browser-qa.js && node --check phase7-digital-life-qa.js
      - name: Run Phase 7 smartphone browser regression
        run: node phase7-browser-qa.js
      - name: Run Phase 7 digital-life expansion regression
        run: node phase7-digital-life-qa.js
      - name: Validate and run Phase 8 financial empire regression
        run: node --check phase8-financial-empire-engine.js && node --check phase8-browser-qa.js && node phase8-browser-qa.js
      - name: Run Phase 9 global economy browser regression
        run: node --check phase9-global-economy-engine.js && node --check phase9-browser-qa.js && node phase9-browser-qa.js
      - name: Validate and run Phase 10 autonomous competitor regression
        run: node --check phase10-autonomous-competitors-engine.js && node --check phase10-autonomous-competitors-qa.js && node phase10-autonomous-competitors-qa.js
      - name: Run Phase 10 autonomous competitor browser QA
        run: node phase10-browser-qa.js
      - name: Validate and run Phase 11 technology and sustainability regression
        run: node --check phase11-technology-sustainability-engine.js && node --check phase11-technology-sustainability-qa.js && node phase11-technology-sustainability-qa.js
      - name: Run Phase 11 technology and sustainability browser QA
        run: node phase11-browser-qa.js
      - name: Run global geography and travel browser regression
        run: node phase1-global-geography-travel-qa.js
      - name: Validate and run Phase 12 generations regression
        run: node --check phase12-generations-engine.js && node --check phase12-generations-qa.js && node phase12-generations-qa.js
      - name: Run Phase 12 generations browser QA
        run: node phase12-browser-qa.js
      - name: Run Phase 13 release-quality browser QA
        run: node --check phase13-release-quality-engine.js && node --check phase13-release-quality-qa.js && node phase13-release-quality-qa.js
      - name: Validate and run autonomous simulation controller regression
        run: node --check autonomous-simulation-engine.js && node --check autonomous-simulation-qa.js && node autonomous-simulation-qa.js && node --check npc-autonomy-engine.js && node --check npc-autonomy-qa.js && node npc-autonomy-qa.js
      - name: Run three-year cross-phase integration stress test
        run: node integration-multiyear-qa.js
      - name: Enforce one-year save round-trip result after full suite
        if: always()
        run: |
          if [ "${{ steps.phase3_save_roundtrip.outcome }}" != "success" ]; then
            echo "One-year simulation/save regression failed; see its earlier log. All remaining phase checks were still executed."
            exit 1
          fi
