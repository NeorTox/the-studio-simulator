name: Deploy THE STUDIO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate JavaScript engines
        run: |
          set -e
          for file in engine-primitives.js phase0-architecture.js phase0-registry.js phase1-world-engine.js phase2-population-engine.js phase3-founder-engine.js phase4-company-engine.js phase5-production-engine.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Build static site
        run: |
          set -e
          mkdir -p dist
          cp index.html engine-primitives.js phase0-architecture.js phase0-registry.js phase1-world-engine.js phase2-population-engine.js phase3-founder-engine.js phase4-company-engine.js phase5-production-engine.js manifest.webmanifest icon.svg sw.js dist/
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/icon.svg
          test -s dist/sw.js
          for file in engine-primitives.js phase0-architecture.js phase0-registry.js phase1-world-engine.js phase2-population-engine.js phase3-founder-engine.js phase4-company-engine.js phase5-production-engine.js; do
            test -s "dist/$file"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
