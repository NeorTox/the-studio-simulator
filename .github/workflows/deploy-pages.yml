name: Deploy THE STUDIO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate every local application engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess
          html = pathlib.Path("index.html").read_text()
          refs = re.findall(r'<script[^>]+src=["\'](\./[^"\']+\.js)["\']', html)
          if not refs:
              raise SystemExit("No local application engines were found in index.html")
          missing = [ref for ref in refs if not pathlib.Path(ref[2:]).is_file()]
          if missing:
              raise SystemExit("Missing referenced application assets: " + ", ".join(missing))
          for ref in refs:
              subprocess.run(["node", "--check", ref[2:]], check=True)
          print(f"Validated {len(refs)} local application engines.")
          PY
          node --check phase13-release-quality-qa.js

      - name: Build complete static application
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html manifest.webmanifest icon.svg sw.js dist/
          python3 - <<'PY'
          import pathlib, re, shutil
          html = pathlib.Path("index.html").read_text()
          refs = re.findall(r'<script[^>]+src=["\'](\./[^"\']+\.js)["\']', html)
          for ref in refs:
              source = pathlib.Path(ref[2:])
              if not source.is_file():
                  raise SystemExit(f"Missing local engine: {source}")
              shutil.copy2(source, pathlib.Path("dist") / source.name)
          required = ["index.html", "manifest.webmanifest", "icon.svg", "sw.js"]
          missing = [name for name in required if not (pathlib.Path("dist") / name).is_file()]
          if missing:
              raise SystemExit("Incomplete release artifact: " + ", ".join(missing))
          for ref in refs:
              if not (pathlib.Path("dist") / pathlib.Path(ref).name).is_file():
                  raise SystemExit("Referenced engine missing from artifact: " + ref)
          print(f"Built {len(refs)} engine assets plus the PWA shell.")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
